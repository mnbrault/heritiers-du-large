name: Deploy GitHub Pages

on:
  push:
    branches: [main, redesign-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout V1 (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: v1

      - name: Checkout V2 (redesign-v2)
        uses: actions/checkout@v4
        with:
          ref: redesign-v2
          path: v2

      - name: Install & build V1
        working-directory: v1
        run: |
          npm ci
          npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Install & build V2
        working-directory: v2
        run: |
          npm ci
          npm run build
        env:
          GITHUB_PAGES: "true"
          PAGES_VERSION_PATH: "/v2"

      - name: Assemble both versions
        run: |
          mkdir -p site/v2
          cp -a v1/out/. site/
          cp -a v2/out/. site/v2/
          touch site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
